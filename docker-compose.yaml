services:
  skc-deck-api:
    image: alpine:latest
    command: ./skc-deck-api
    working_dir: /app
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "9010:9010"
    volumes:
      - "./skc-deck-api:/app/skc-deck-api:ro"
      - "./.env_prod:/app/.env_prod:ro"
      - "./certs/certificate.crt:/app/certs/certificate.crt:ro"
      - "./certs/ca_bundle.crt:/app/certs/ca_bundle.crt:ro"
      - "./certs/private.key:/app/certs/private.key:ro"
      - "./certs/skc-deck-api-db.pem:/app/certs/skc-deck-api-db.pem:ro"
      - "./certs/ca_bundle.crt:/etc/ssl/certs/zero-ssl-ca.crt:ro" # trusting zero ssl CA cert in private network. Though its not needed anymore since the golang app will send the CA Bundle, it is still nice to have for reference
    tmpfs:
      - "/app/certs:size=64k,mode=0700,uid=1000,gid=1000" # CombineCerts writes certs/concatenated.crt at startup; the input files above are bind-mounted on top
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9010"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 60m
          cpus: "1.0"
          pids: 128
    memswap_limit: 60m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - skc
    environment:
      - SKC_DECK_API_DOT_ENV_FILE=.env_prod
      - GOMEMLIMIT=48MiB
    labels:
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port": "%%port%%"}]'
      com.datadoghq.ad.logs: >-
        [{
          "source": "go",
          "service": "skc-deck-api",
          "log_processing_rules": [{
            "type": "exclude_at_match",
            "name": "exclude_health_check",
            "pattern" : "\"app.flow\":\"Status\""
          }, {
            "type": "exclude_at_match",
            "name": "exclude_docker_healthcheck_tls_eof",
            "pattern" : "TLS handshake error from 127\\.0\\.0\\.1:\\d+: EOF"
          }]
        }]
      com.datadoghq.tags.runtime: "golang"
      com.datadoghq.tags.env: "prod"
      com.datadoghq.tags.service: "skc-deck-api"

networks:
  skc:
    name: skc
    driver: bridge
    external: true # network was alredy created, if you need to recreate the network - make this false
